name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: |
          npm install --prefix "$RUNNER_TEMP/npm" --no-save --ignore-scripts --no-audit --no-fund npm@12.1.0
          echo "$RUNNER_TEMP/npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check the package version on npm
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm version check failed: HTTP ${response.status}`);
          }
          const shouldPublish = response.status === 404;
          const tag = version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${shouldPublish}\ntag=${tag}\n`);
          console.log(`${name}@${version}: ${shouldPublish ? 'ready to publish' : 'already published'}`);
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Publish the new version
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --provenance --ignore-scripts --tag "${{ steps.release.outputs.tag }}"
